name: Build AntiPro
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o AntiPro-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: AntiPro/pom.xml
      - run: mvn --batch-mode clean package
        working-directory: AntiPro
      - uses: actions/upload-artifact@v4
        with:
          name: AntiPro
          path: AntiPro/target/AntiPro-1.0.0.jar
